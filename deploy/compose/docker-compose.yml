# PCI Kernel — local development / customer-zero compose stack
#
# Work package : WP-0001
# Sources      : docs/operations/deployment-architecture.md
#                docs/operations/installation-architecture.md
#                SPEC-0026 Deployment and Air-Gapped Operation
#                docs/security/supply-chain-security.md
#
# EXECUTED AND VERIFIED 2026-08-19 on the authorised host: PostgreSQL healthy, migrations
#   applied, 26 integration tests passing against it. See WP-0001 report section 11.
#
# STORAGE BOUNDARY — RESOLVED (DISC-0004).
#   The authorised data root is /data/docker, and the Docker daemon's `data-root` is set to it
#   on the PCI server. Named volumes therefore resolve under /data/docker/volumes/... and
#   already satisfy the boundary. Verified 2026-08-19:
#
#     /data/docker/volumes/pci-kernel_postgres-data/_data
#
#   Relocating `data-root` is the stronger guarantee, because it also captures image layers and
#   container writable state — not only the paths someone remembered to bind-mount. Do NOT
#   substitute bind mounts: they would be weaker, and they are no longer needed.
#
# SETUP: copy .env.example to .env and replace every REPLACE_ME value before running this
#   stack. Both POSTGRES_SUPERUSER_PASSWORD and PCI_APP_PASSWORD are required, and the kernel
#   refuses to start without at least one entry in PCI_STATIC_PRINCIPALS (DISC-0008).

name: pci-kernel

services:
  postgres:
    # Pinned by minor version per supply-chain-security.md ("Pin or constrain production
    # dependencies"). Pin by digest before any production use.
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pci}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-pci_admin}
      # Injected from the environment. Never commit a real value (ADR-0009).
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # Supplies pci.app_password to the initdb session so initdb/00-roles.sql can create the
      # least-privilege runtime role with a password. Without this the role was created
      # unusable and the stack still reported healthy (DISC-0007, fixed by TASK-0004).
      # PGOPTIONS reaches the entrypoint's own psql; the value is never written to disk.
      PGOPTIONS: -c pci.app_password=${PCI_APP_PASSWORD:?PCI_APP_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the least-privilege runtime role. Runs once, on first initialisation only.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      # Bound to loopback so the database is not exposed on the host network by default.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-pci_admin} -d ${POSTGRES_DB:-pci}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    # Least privilege at the container level.
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: ../../services/kernel
      dockerfile: Dockerfile
    # Deterministic startup ordering (SPEC-0026): migrations complete before the kernel starts.
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Migrations run as the OWNER role, which is more privileged than the runtime role.
      PCI_DATABASE_URL: postgres://${POSTGRES_SUPERUSER:-pci_admin}:${POSTGRES_SUPERUSER_PASSWORD}@postgres:5432/${POSTGRES_DB:-pci}
    command: ["node", "src/cli/migrate.ts"]
    restart: "no"
    security_opt:
      - no-new-privileges:true

  kernel:
    build:
      context: ../../services/kernel
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PCI_ENV: ${PCI_ENV:-development}
      PCI_HOST: 0.0.0.0
      PCI_PORT: "8080"
      PCI_LOG_LEVEL: ${PCI_LOG_LEVEL:-info}
      PCI_STORE_MODE: postgres
      # The kernel connects as the LEAST-PRIVILEGE runtime role, which must not hold
      # BYPASSRLS or SUPERUSER — otherwise ADR-0016 layer 3 is inert.
      PCI_DATABASE_URL: postgres://pci_app:${PCI_APP_PASSWORD:?PCI_APP_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-pci}
      PCI_IDENTITY_MODE: ${PCI_IDENTITY_MODE:-static}
      PCI_STATIC_PRINCIPALS: ${PCI_STATIC_PRINCIPALS:-[]}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres-data:
    # Resolves under the daemon data-root, which is /data/docker on the PCI server (DISC-0004).
    driver: local
