# PCI Kernel — local development / customer-zero compose stack
#
# Work package : WP-0001
# Sources      : docs/operations/deployment-architecture.md
#                docs/operations/installation-architecture.md
#                SPEC-0026 Deployment and Air-Gapped Operation
#                docs/security/supply-chain-security.md
#
# ⚠ NEVER EXECUTED. Docker was not available on the authoring host during WP-0001.
#   See implementation/blockers/BLK-0001-no-execution-environment.md.
#
# ⚠ STORAGE BOUNDARY UNRESOLVED.
#   deployment-architecture.md:22 requires that persistent data live on explicitly managed
#   storage rather than the OS root filesystem. The concrete boundary (referred to verbally as
#   "/data/docker") is NOT recorded anywhere in the repository, so this file uses NAMED VOLUMES
#   rather than inventing host paths. Substituting a guessed bind mount would be exactly the
#   silent infrastructure decision the operating rules prohibit.
#
#   Once implementation/comms/MSG-0001 is answered, replace the named volumes below with
#   explicit bind mounts under the authorised data root, e.g.:
#
#     volumes:
#       - /data/docker/pci/postgres:/var/lib/postgresql/data
#
#   and set the Docker daemon `data-root` accordingly in /etc/docker/daemon.json.

name: pci-kernel

services:
  postgres:
    # Pinned by minor version per supply-chain-security.md ("Pin or constrain production
    # dependencies"). Pin by digest before any production use.
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pci}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-pci_admin}
      # Injected from the environment. Never commit a real value (ADR-0009).
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the least-privilege runtime role. Runs once, on first initialisation only.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      # Bound to loopback so the database is not exposed on the host network by default.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-pci_admin} -d ${POSTGRES_DB:-pci}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    # Least privilege at the container level.
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: ../../services/kernel
      dockerfile: Dockerfile
    # Deterministic startup ordering (SPEC-0026): migrations complete before the kernel starts.
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Migrations run as the OWNER role, which is more privileged than the runtime role.
      PCI_DATABASE_URL: postgres://${POSTGRES_SUPERUSER:-pci_admin}:${POSTGRES_SUPERUSER_PASSWORD}@postgres:5432/${POSTGRES_DB:-pci}
    command: ["node", "src/cli/migrate.ts"]
    restart: "no"
    security_opt:
      - no-new-privileges:true

  kernel:
    build:
      context: ../../services/kernel
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PCI_ENV: ${PCI_ENV:-development}
      PCI_HOST: 0.0.0.0
      PCI_PORT: "8080"
      PCI_LOG_LEVEL: ${PCI_LOG_LEVEL:-info}
      PCI_STORE_MODE: postgres
      # The kernel connects as the LEAST-PRIVILEGE runtime role, which must not hold
      # BYPASSRLS or SUPERUSER — otherwise ADR-0016 layer 3 is inert.
      PCI_DATABASE_URL: postgres://pci_app:${PCI_APP_PASSWORD:?PCI_APP_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-pci}
      PCI_IDENTITY_MODE: ${PCI_IDENTITY_MODE:-static}
      PCI_STATIC_PRINCIPALS: ${PCI_STATIC_PRINCIPALS:-[]}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres-data:
    # Replace with a bind mount under the authorised data root once MSG-0001 is answered.
    driver: local
